# Test data for PortfolioPlannerTest, derived from the "Portfolio Planner Flow" PRD
# (14-Jul-2026). Values here are inputs/expectations for the test cases that are
# actually implemented (real locators only) - see PortfolioPlannerTest for the list
# of PRD-derived cases that are still stubs pending missing screens' HTML.

# Confirmed (2026-09-29): can generate a plan but has no active transaction account,
# so "Invest Now" never reaches Cart for this investor - use only for plan-generation
# tests, never for the Invest Now / Cart test.
investor.name=Manish Khatri

# Confirmed (2026-09-29): has an active advice-cum-transaction account and can
# complete a transaction - use for tests that must reach the Cart screen (e.g.
# verifyInvestNowNavigatesToCart).
investor.name.transaction.enabled=Wamiq Azeem Asif

# --- Invest for higher returns (SIP) ---
higher.returns.sip.amount=5000
higher.returns.investment.period=10

# --- Invest for monthly income ---
monthly.income.amount=20000

# --- Invest to save tax ---
tax.saving.amount=12500
# Substring only - PRD doesn't specify exact wording, this is the real banner text.
tax.saving.lockin.warning.contains=Tax-saving funds have a lock-in period of 3 years

# --- PRD acceptance criterion: "On all three planner option screens, 'Show
# investment plan' replaces 'Calculate'". The monthly-income and tax-saving
# expectations below intentionally encode the PRD wording, not the current
# button text on those two screens ("Get Investment Plan" / "Continue") - see
# the corresponding test methods for why that's a deliberate, flagged mismatch.
expected.button.higher.returns.cta=Show investment plan
expected.button.monthly.income.cta=Show investment plan
expected.button.tax.saving.cta=Show investment plan

# --- PRD 11.2: the investment-plan headline changes per goal. These are the exact
# strings the PRD gives for the "No goal, Start investing" journey (our test flow):
# 11.2.1's note says its shown headline is also the fallback when nothing is mapped
# to a goal - "Your investment plan" is what higher-returns actually shows today.
# The other two are PRD-mandated text, not necessarily what's shipped - see the
# corresponding test methods for confirmed vs known-gap status.
expected.heading.higher.returns=Your investment plan
expected.heading.monthly.income=Your regular income plan
expected.heading.tax.saving=Your tax-saving plan

# ============================================================
# Staged data for the disabled/stub test cases (PortfolioPlannerTest has one
# @Test(enabled = false) per PRD scenario with no locators yet). Not read by any
# Java code today - reserved so implementing a stub later doesn't also require
# hunting down these values again. Message/threshold values are copied verbatim
# from the PRD; anything CHANGE_ME-prefixed is environment-specific data this
# framework has no way to know (a real QA investor/account in that exact state)
# and must be filled in once such a test investor is identified.
# ============================================================

# --- Select Investor: add-investor limit ---
investor.max.count=6

# --- Free-account test identity (Select Investor skip / masked plan) ---
free.user.username=${ENV_FREE_USER_USERNAME}
free.user.password=${ENV_FREE_USER_PASSWORD}

# --- Test investors in specific states (KYC / risk assessment / transaction account) ---
investor.kyc.pending.name=CHANGE_ME_kyc_pending_investor
investor.kyc.underprocess.name=CHANGE_ME_kyc_underprocess_investor
investor.risk.assessment.pending.name=CHANGE_ME_risk_assessment_pending_investor
investor.transaction.inactive.name=Manish Khatri
investor.transaction.underprocess.name=CHANGE_ME_transaction_underprocess_investor

# --- Field validation error messages (PRD's documented error-message table) ---
validation.error.required.field=This is a required field
validation.error.period.blank=Please enter period.
validation.error.monthly.amount.min=Monthly amount must be greater than or equal to 1000.
validation.error.onetime.amount.min=One-time amount must be greater than or equal to 5000.

# --- Fund status notifications (Edit Investment Plan) ---
fund.status.suspended.message=Fund is suspended for sale
fund.status.exit.message=This fund is marked as 'Exit'
fund.status.avoidable.message=This fund is marked as 'Avoidable'

# --- Transaction-account alerts on Invest Now ---
alert.transaction.inactive=Your Transaction account is inactive.
alert.transaction.underprocess=Your transaction account setup is under process.

# --- Review page ---
review.disclaimer.text=I acknowledge that the above investment plan is different from what was recommended to \
  me. It may not align with my investing need or risk tolerance and therefore, should not be considered as \
  investment advice.
review.deviation.color.threshold.percent=5

# --- Invest to save tax: financial-year question window ---
tax.financial.year.window.start.day=01-Jan
tax.financial.year.window.end.day=31-Mar
